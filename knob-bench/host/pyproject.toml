[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knob-bench"
version = "0.1.0"
description = "Host for the Helix knob bench: sniffer packets, knob log, and display"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
knob-bench = "knob_bench.__main__:main"

[tool.setuptools.packages.find]
include = ["knob_bench*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
