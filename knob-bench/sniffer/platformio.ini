; Listen-only UART tap. The knob firmware at the repo root is a separate project.
; GPIO 19 and 20 are native USB. Both listen pins must be something else.
; Set TAP_RX_K2D to the wire the knob drives (knob TX / DSP RX).
; Set TAP_RX_D2K to the wire the DSP drives (DSP TX / knob RX).

[env:esp32-s3-sniffer]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSB_MANUFACTURER='"knob-bench"'
    -DUSB_PRODUCT='"sniffer"'
    -DTAP_RX_K2D=4
    -DTAP_RX_D2K=5
    -DTAP_BAUD=230400
    -DTAP_RX_TOUT_BITS=70
